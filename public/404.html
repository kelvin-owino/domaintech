<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages & custom domains
      // Handles subdirectories like https://<user>.github.io/<repo>/ as well as custom domains
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var isGitHubPagesSubdir = window.location.hostname.endsWith('github.io') && pathSegments.length >= 1;
      var segmentCount = isGitHubPagesSubdir ? 1 : 0;
      var loc = window.location;
      var repoBase = loc.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var pathAfterBase = loc.pathname.slice(1).split('/').slice(segmentCount).join('/');

      loc.replace(
        loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
        repoBase + '/?p=/' +
        pathAfterBase.replace(/&/g, '~and~') +
        (loc.search ? '&q=' + loc.search.slice(1).replace(/&/g, '~and~') : '') +
        loc.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
